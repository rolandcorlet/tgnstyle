<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221B17" />
      <stop offset="100%" stop-color="#120E0C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7D4" />
      <stop offset="50%" stop-color="#D4AF87" />
      <stop offset="100%" stop-color="#9A7252" />
    </linearGradient>
  </defs>

  <!-- Clean borderless dark espresso background -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bgGrad)" />

  <!-- Bold full-size gold TGN -->
  <text
    x="64"
    y="84"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', 'Times New Roman', Georgia, serif"
    font-size="56"
    font-weight="700"
    letter-spacing="-1"
    fill="url(#goldGrad)"
  >TGN</text>
</svg>
